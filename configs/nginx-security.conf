# Production Nginx security headers & sensitive artifact blocking (MIT)
# Include inside your HTTPS `server { ... }` block.

server_tokens off;

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; upgrade-insecure-requests" always;

# Deny access to dotfiles (.env, .git, .DS_Store, .htaccess) except /.well-known/
location ~ /\.(?!well-known) {
    deny all;
    return 404;
}

# Deny public access to production JavaScript source maps & backup dumps
location ~* \.(?:map|bak|sql|sqlite|db|old|orig)$ {
    deny all;
    return 404;
}
